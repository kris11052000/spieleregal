name: Installer bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Spielregal
    shell: bash

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Mac
            script: dist:mac
            files: Spielregal/dist/*.dmg
          - os: windows-latest
            label: Windows
            script: dist:win
            files: Spielregal/dist/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "Versuch $i fehlgeschlagen – neuer Versuch in 20 s …"
            sleep 20
          done
          exit 1

      - name: Installer bauen
        run: |
          for i in 1 2; do
            npm run ${{ matrix.script }} && exit 0
            echo "Build-Versuch $i fehlgeschlagen – neuer Versuch …"
            sleep 20
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Version lesen
        id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: Spielregal ${{ steps.version.outputs.v }}
          files: ${{ matrix.files }}
